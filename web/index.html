<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HYPER·HOME — TV Mirror</title>
<style>
  :root {
    --room: #04050a;
    --screen: #0a0e17;
    --panel: #11151f;
    --line: #1e2534;
    --ink: #e8edf8; --dim: #69748f; --faint: #3d4763;
    --red: #ff5a66; --amber: #ffb84d; --green: #3ecf8e; --blue: #5b9dff; --grey: #8b95ab;
    --font: "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1400px 800px at 50% -15%, #131a2e 0%, var(--room) 65%);
    color: var(--ink); font: 14px/1.4 var(--font);
    display: flex; align-items: center; justify-content: center;
    padding: 2.2vh 2vw; overflow: hidden;
  }

  /* ============ the set ============ */
  .set { width: 100%; height: 100%; max-width: 1500px; display: flex; flex-direction: column; }
  .panel {
    position: relative; flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--screen); border: 1px solid #242b3b; border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 40px 120px -30px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,.02);
  }
  .panel::after {           /* scanlines + vignette */
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 60;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.016) 0 1px, transparent 1px 3px),
      radial-gradient(120% 130% at 50% 35%, transparent 60%, rgba(0,0,0,.4) 100%);
  }
  .chin {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 20px 0;
  }
  .brand { color: #333c50; font-weight: 800; letter-spacing: 6px; font-size: 11px; }
  .brand b { color: #7f8db1; }
  .led { width: 7px; height: 7px; border-radius: 50%; background: #333; transition: .4s; }
  .led.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .led.stdby { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: breathe 3s infinite; }
  .led.off { background: var(--red); }
  @keyframes breathe { 50% { opacity: .2; } }

  /* ============ top bar ============ */
  .top {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 20px;
    padding: 16px 24px 12px; border-bottom: 1px solid var(--line);
    position: relative; z-index: 10;
  }
  .clock { font-size: 26px; font-weight: 700; letter-spacing: 2px; line-height: 1; }
  .date { color: var(--dim); font-size: 11px; margin-top: 4px; }
  .top .spacer { flex: 1; }
  .nowapp {
    font-size: 11px; color: var(--dim); border: 1px solid #232b3e;
    background: rgba(14,18,30,.7); border-radius: 20px; padding: 5px 12px;
    max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .nowapp b { color: var(--blue); }
  .conn { font-size: 11px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .conn.on i { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .search {
    background: #0d1220; border: 1px solid #232b3e; color: var(--ink);
    border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 12px;
    width: 200px; outline: none;
  }
  .search:focus { border-color: var(--blue); }

  /* ============ body: rail + grid ============ */
  .body { display: flex; flex: 1; min-height: 0; position: relative; z-index: 10; }

  .rail {
    width: 220px; flex: 0 0 auto; border-right: 1px solid var(--line);
    padding: 16px 10px; display: flex; flex-direction: column; gap: 4px;
    overflow-y: auto;
  }
  .ritem {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px; cursor: pointer;
    color: var(--dim); font-size: 12.5px; border: 1px solid transparent;
    transition: .12s;
  }
  .ritem:hover { background: var(--panel); color: var(--ink); }
  .ritem.active { background: var(--panel); color: var(--ink); border-color: #2a3140; }
  .ritem .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .ritem .n { margin-left: auto; font-size: 10.5px; color: var(--faint); }
  .ritem .kbd { font-size: 9px; color: var(--faint); border: 1px solid #2a3140; border-radius: 3px; padding: 0 4px; }
  .rail .sep { height: 1px; background: var(--line); margin: 10px 6px; }
  .ritem.sys { font-size: 11.5px; }

  .gridwrap { flex: 1; min-width: 0; overflow-y: auto; padding: 18px 24px; scrollbar-width: thin; }
  .gridhead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .gridhead h2 { font-size: 15px; letter-spacing: .5px; }
  .gridhead span { color: var(--faint); font-size: 11.5px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 12px; padding-bottom: 30px;
  }
  .empty { color: var(--faint); padding: 40px 0; font-size: 13px; }

  .card {
    background: linear-gradient(165deg, #131928, #0d1120);
    border: 1px solid #232b3e; border-radius: 12px;
    padding: 14px; position: relative; cursor: pointer;
    transition: transform .12s, border-color .12s, box-shadow .12s;
    --acc: var(--grey); min-height: 108px;
  }
  .card:hover { border-color: #3a445c; }
  .card.c-remove { --acc: var(--red); }
  .card.c-optional { --acc: var(--amber); }
  .card.c-user { --acc: var(--blue); }
  .card.c-critical { --acc: var(--green); }
  .card.c-core { --acc: #3a4254; }
  .card.focused {
    transform: scale(1.03); border-color: var(--acc);
    box-shadow: 0 14px 34px -10px rgba(0,0,0,.8), 0 0 0 1px var(--acc);
    z-index: 5;
  }
  .card.off { filter: grayscale(1) brightness(.5); }
  .card .top2 { display: flex; gap: 12px; align-items: flex-start; }
  .mono {
    width: 40px; height: 40px; border-radius: 9px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .card .nm { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .card .pk { font-size: 10.5px; color: var(--faint); margin-top: 3px; word-break: break-all; }
  .card .meta2 { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .pill {
    font-size: 9px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
    padding: 2px 8px; border-radius: 10px;
  }
  .p-on { background: #0f2c22; color: var(--green); }
  .p-off { background: #3d1720; color: var(--red); }
  .p-gone { background: #1c2230; color: var(--grey); }
  .card .ver { font-size: 10px; color: var(--faint); margin-left: auto; }

  /* ============ bottom status bar ============ */
  .status {
    flex: 0 0 auto;
    position: relative; z-index: 10;
    display: flex; align-items: center; gap: 20px;
    padding: 10px 24px; border-top: 1px solid var(--line);
    background: rgba(8,11,18,.9); font-size: 11px; color: var(--dim);
  }
  .status b { color: var(--ink); font-weight: 600; }
  .gauge { display: flex; align-items: center; gap: 8px; }
  .bar { width: 90px; height: 5px; border-radius: 3px; background: #1a2130; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--blue); transition: width .6s; }
  .status .keys { margin-left: auto; color: var(--faint); font-size: 10px; }
  .keys kbd { border: 1px solid #2a3140; border-radius: 4px; padding: 0 5px; }

  /* ============ overlays ============ */
  .statefull {
    position: absolute; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    background: #04060b;
  }
  .statefull.show { display: flex; }
  #nosignal canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .16; }
  #nosignal .big { font-size: 30px; letter-spacing: 8px; color: #3c4763; }
  #nosignal .sub { color: #2c3550; font-size: 11px; letter-spacing: 3px; }
  #standby .clock { font-size: 56px; font-weight: 200; color: #2c3550; letter-spacing: 5px; }
  #standby .sub { color: #1d2438; font-size: 12px; letter-spacing: 4px; }

  .modal {
    position: absolute; inset: 0; z-index: 55; display: none;
    align-items: center; justify-content: center;
    background: rgba(3,5,9,.7); backdrop-filter: blur(3px);
  }
  .modal.show { display: flex; }
  .dcard {
    width: min(480px, 90%); background: #101623; border: 1px solid #2a3450;
    border-radius: 14px; padding: 24px; box-shadow: 0 30px 80px rgba(0,0,0,.8);
  }
  .dcard h2 { font-size: 19px; margin-bottom: 2px; }
  .dcard .pkg { color: var(--dim); font-size: 12px; word-break: break-all; margin-bottom: 16px; }
  .dcard dl { display: grid; grid-template-columns: 100px 1fr; gap: 8px 14px; font-size: 12.5px; }
  .dcard dt { color: var(--dim); }
  .dcard dd { margin: 0; }
  .dcard .close { margin-top: 18px; color: var(--faint); font-size: 10.5px; }
  .tag { font-size: 9.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 2px 9px; border-radius: 10px; }
  .t-remove { background: #3d1720; color: var(--red); }
  .t-optional { background: #33270f; color: var(--amber); }
  .t-user { background: #152a44; color: var(--blue); }
  .t-critical { background: #0f2c22; color: var(--green); }
  .t-core { background: #1c2230; color: var(--grey); }

  .osd {
    position: absolute; top: 0; right: 0; bottom: 0; width: min(520px, 55%); z-index: 45;
    background: rgba(8,11,19,.96); border-left: 1px solid #273046;
    transform: translateX(102%); transition: transform .22s;
    display: flex; flex-direction: column;
  }
  .osd.show { transform: translateX(0); }
  .osd .head { padding: 14px 16px; border-bottom: 1px solid #1d2436; display: flex; gap: 10px; align-items: center; }
  .osd .head b { font-size: 11px; letter-spacing: 2px; }
  .osd input {
    flex: 1; background: #0d1220; border: 1px solid #273046; color: var(--ink);
    border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 12px; outline: none;
  }
  .osd .list { overflow-y: auto; flex: 1; scrollbar-width: thin; padding-bottom: 20px; }
  .osd .ns { padding: 12px 16px 4px; font-size: 10px; letter-spacing: 2px; color: var(--faint); text-transform: uppercase; }
  .kv { display: grid; grid-template-columns: 45% 1fr; padding: 3px 16px; font-size: 11px; gap: 8px; }
  .kv .k { color: var(--dim); word-break: break-all; }
  .kv .v { color: var(--ink); word-break: break-all; }
</style>
</head>
<body>

<div class="set">
  <div class="panel">

    <div class="top">
      <div>
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="date"></div>
      </div>
      <div class="spacer"></div>
      <input class="search" id="q" placeholder="filter apps  ( / )">
      <div class="nowapp" id="nowapp"></div>
      <div class="conn" id="conn"><i></i><span>…</span></div>
    </div>

    <div class="body">
      <nav class="rail" id="rail"></nav>
      <main class="gridwrap" id="gridwrap">
        <div class="gridhead"><h2 id="catTitle"></h2><span id="catSub"></span></div>
        <div class="grid" id="grid"></div>
      </main>
    </div>

    <div class="status">
      <div class="gauge"><span>STORAGE</span><div class="bar"><i id="gStorage"></i></div><b id="tStorage"></b></div>
      <div class="gauge"><span>RAM</span><div class="bar"><i id="gRam"></i></div><b id="tRam"></b></div>
      <span>Panel <b id="mRes"></b></span>
      <span>Launcher <b id="mLauncher"></b></span>
      <span>ADB <b id="mLat"></b></span>
      <div class="keys">
        <kbd>←→↑↓</kbd> move · <kbd>⏎</kbd> details · <kbd>1-6</kbd> section · <kbd>s</kbd> settings · <kbd>/</kbd> filter
      </div>
    </div>

    <div class="osd" id="osd">
      <div class="head"><b>SETTINGS OSD</b><input id="osdq" placeholder="filter settings…"></div>
      <div class="list" id="osdlist"></div>
    </div>

    <div class="modal" id="detail"><div class="dcard" id="dcard"></div></div>

    <div class="statefull" id="nosignal">
      <canvas id="noise"></canvas>
      <div class="big">NO SIGNAL</div>
      <div class="sub">ADB LINK DOWN</div>
    </div>
    <div class="statefull" id="standby">
      <div class="clock" id="sbclock">--:--</div>
      <div class="sub">STANDBY</div>
    </div>

  </div>
  <div class="chin">
    <span class="brand">hyper<b>·</b>home</span>
    <span class="led off" id="led"></span>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const CATS = [
  { key: "user",     title: "Your apps",              sub: "installed by you",        color: "var(--blue)"  },
  { key: "remove",   title: "Bloat · ads · telemetry",sub: "safe to remove",          color: "var(--red)"   },
  { key: "optional", title: "Optional features",      sub: "usage dependent",         color: "var(--amber)" },
  { key: "off",      title: "Disabled / removed",     sub: "currently off",           color: "#4a536e"      },
  { key: "critical", title: "Protected",              sub: "never disable",           color: "var(--green)" },
  { key: "core",     title: "System core",            sub: "android platform",        color: "var(--grey)"  },
];
const CLS_LABEL = { user: "your app", remove: "safe to remove", optional: "optional",
                    critical: "critical", core: "system" };

let state = { packages: [], device: {}, settings: {}, live: {}, connected: false };
let cat = "user";
let focusIdx = 0, focusPkg = null, railFocus = false;
let query = "";

const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const monoHue = p => { let h = 0; for (const c of p) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const initials = n => n.split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
const statusOf = p => p.uninstalled ? ["gone", "removed"] : p.disabled ? ["off", "disabled"] : ["on", "enabled"];

function itemsFor(key) {
  const q = query.toLowerCase();
  return state.packages.filter(p => {
    if (key === "off") { if (!p.disabled && !p.uninstalled) return false; }
    else if (p.cls !== key) return false;
    return !q || p.pkg.toLowerCase().includes(q) || p.name.toLowerCase().includes(q);
  });
}

function renderRail() {
  const el = $("rail"); el.innerHTML = "";
  CATS.forEach((c, i) => {
    const n = itemsFor(c.key).length;
    const d = document.createElement("div");
    d.className = "ritem" + (cat === c.key ? " active" : "");
    d.innerHTML = `<span class="dot" style="background:${c.color}"></span>
      <span>${esc(c.title)}</span><span class="n">${n}</span><span class="kbd">${i + 1}</span>`;
    d.onclick = () => { cat = c.key; focusIdx = 0; focusPkg = null; render(); };
    el.appendChild(d);
  });
  const sep = document.createElement("div"); sep.className = "sep"; el.appendChild(sep);
  const s = document.createElement("div");
  s.className = "ritem sys";
  s.innerHTML = `<span class="dot" style="background:var(--faint)"></span>
    <span>Settings OSD</span><span class="kbd">s</span>`;
  s.onclick = toggleOSD; el.appendChild(s);
}

function renderGrid() {
  const c = CATS.find(x => x.key === cat);
  const items = itemsFor(cat);
  $("catTitle").textContent = c.title;
  $("catSub").textContent = `${c.sub} · ${items.length} package${items.length === 1 ? "" : "s"}`;
  // restore focus
  if (focusPkg) {
    const ix = items.findIndex(p => p.pkg === focusPkg);
    focusIdx = ix >= 0 ? ix : 0;
  }
  const g = $("grid"); g.innerHTML = "";
  if (!items.length) {
    g.innerHTML = `<div class="empty">nothing here${query ? " — try clearing the filter" : ""}</div>`;
    return;
  }
  items.forEach((p, i) => {
    const [sc, st] = statusOf(p);
    const el = document.createElement("div");
    el.className = `card c-${p.cls}` + (sc !== "on" ? " off" : "") + (i === focusIdx ? " focused" : "");
    el.innerHTML = `
      <div class="top2">
        <div class="mono" style="background:linear-gradient(140deg,hsl(${monoHue(p.pkg)},45%,38%),hsl(${monoHue(p.pkg)},50%,24%))">${esc(initials(p.name))}</div>
        <div><div class="nm">${esc(p.name)}</div><div class="pk">${esc(p.pkg)}</div></div>
      </div>
      <div class="meta2"><span class="pill p-${sc}">${st}</span><span class="ver">v${esc(p.version || "?")}</span></div>`;
    el.onclick = () => { focusIdx = i; focusPkg = p.pkg; openDetail(p); };
    el.onmouseenter = () => { focusIdx = i; focusPkg = p.pkg; paintFocus(); };
    g.appendChild(el);
  });
}

function paintFocus() {
  document.querySelectorAll(".card.focused").forEach(x => x.classList.remove("focused"));
  const t = $("grid").children[focusIdx];
  if (t) { t.classList.add("focused"); t.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  const p = itemsFor(cat)[focusIdx]; if (p) focusPkg = p.pkg;
}

function renderStatus() {
  const d = state.device || {};
  $("mRes").textContent = (d.resolution || "").split("\n")[0] || "—";
  $("mLauncher").textContent = (d.launcher || "").split("/")[0] || "—";
  const m = /([\d.]+)G? free of ([\d.]+)G/.exec(d.storage || "");
  if (m) {
    const free = +m[1], tot = +m[2];
    $("gStorage").style.width = (100 - free / tot * 100) + "%";
    $("tStorage").textContent = `${(tot - free).toFixed(1)}G/${tot}G`;
  }
  if (d.ram) {
    const kb = parseInt(d.ram.replace(/[^\d]/g, ""));
    if (kb) { $("gRam").style.width = Math.min(100, kb / 2097152 * 100) + "%"; }
    $("tRam").textContent = d.ram.replace(" (status normal)", "");
  }
}

function render() { renderRail(); renderGrid(); renderStatus(); }

/* ---------- detail ---------- */
function openDetail(p) {
  const [, st] = statusOf(p);
  $("dcard").innerHTML = `
    <h2>${esc(p.name)}</h2><div class="pkg">${esc(p.pkg)}</div>
    <dl>
      <dt>class</dt><dd><span class="tag t-${p.cls}">${CLS_LABEL[p.cls] || p.cls}</span></dd>
      <dt>status</dt><dd>${st}</dd>
      <dt>version</dt><dd>${esc(p.version || "unknown")}</dd>
      <dt>source</dt><dd>${p.third ? "user installed" : "system / preinstalled"}</dd>
      ${p.note ? `<dt>notes</dt><dd>${esc(p.note)}</dd>` : ""}
    </dl>
    <div class="close">esc / ⏎ — close</div>`;
  $("detail").classList.add("show");
}
const closeDetail = () => $("detail").classList.remove("show");
$("detail").onclick = e => { if (e.target.id === "detail") closeDetail(); };

/* ---------- OSD ---------- */
function renderOSD() {
  const q = $("osdq").value.toLowerCase();
  const el = $("osdlist"); el.innerHTML = "";
  for (const [ns, kv] of Object.entries(state.settings || {})) {
    const rows = Object.entries(kv).filter(([k, v]) => !q || (k + "=" + v).toLowerCase().includes(q));
    if (!rows.length) continue;
    const h = document.createElement("div");
    h.className = "ns"; h.textContent = `${ns} · ${rows.length}`; el.appendChild(h);
    for (const [k, v] of rows) {
      const d = document.createElement("div");
      d.className = "kv";
      d.innerHTML = `<span class="k">${esc(k)}</span><span class="v">${esc(v)}</span>`;
      el.appendChild(d);
    }
  }
}
$("osdq").oninput = renderOSD;
const osdOpen = () => $("osd").classList.contains("show");
function toggleOSD() { $("osd").classList.toggle("show"); if (osdOpen()) renderOSD(); }

/* ---------- tv states ---------- */
function paintState() {
  const on = state.connected;
  const wake = (state.live && state.live.wake) || "Awake";
  const asleep = wake && wake !== "Awake";
  $("nosignal").classList.toggle("show", !on);
  $("standby").classList.toggle("show", on && asleep);
  $("led").className = "led " + (!on ? "off" : asleep ? "stdby" : "on");
  const c = $("conn");
  c.className = "conn" + (on ? " on" : "");
  c.querySelector("span").textContent = on ? `LIVE · ${state.device_addr || "device"}` : "NO LINK";
  const f = state.live && state.live.focus;
  $("nowapp").innerHTML = on && f ? `now on screen <b>${esc(f)}</b>` : (on ? "screen idle" : "—");
}

/* ---------- noise ---------- */
const nz = $("noise"), nctx = nz.getContext("2d");
setInterval(() => {
  if (!$("nosignal").classList.contains("show")) return;
  const w = nz.width = nz.offsetWidth / 4, h = nz.height = nz.offsetHeight / 4;
  const img = nctx.createImageData(w, h);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255 | 0;
    img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255;
  }
  nctx.putImageData(img, 0, 0);
}, 80);

/* ---------- clock ---------- */
function tickClock() {
  const n = new Date();
  const t = n.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  $("clock").textContent = t; $("sbclock").textContent = t;
  $("date").textContent = n.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
}
setInterval(tickClock, 1000); tickClock();

/* ---------- keys ---------- */
function gridCols() {
  const g = $("grid");
  if (!g.children.length) return 1;
  const w = g.children[0].offsetLeft;
  let cols = 0;
  for (const c of g.children) { if (c.offsetLeft === w) cols++; else break; }
  return Math.max(1, cols);
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if ($("detail").classList.contains("show")) {
    if (["Escape", "Enter", " "].includes(e.key)) { e.preventDefault(); closeDetail(); }
    return;
  }
  if (e.key === "Escape" && osdOpen()) { toggleOSD(); return; }
  if (e.key === "s" || e.key === "S") { toggleOSD(); return; }
  if (e.key === "/") { e.preventDefault(); $("q").focus(); return; }
  const ni = +e.key;
  if (ni >= 1 && ni <= CATS.length) { cat = CATS[ni - 1].key; focusIdx = 0; focusPkg = null; render(); return; }

  const items = itemsFor(cat);
  const cols = gridCols();
  switch (e.key) {
    case "ArrowRight": if (focusIdx < items.length - 1) { focusIdx++; paintFocus(); } break;
    case "ArrowLeft":  if (focusIdx > 0) { focusIdx--; paintFocus(); } break;
    case "ArrowDown":  if (focusIdx + cols < items.length) { focusIdx += cols; paintFocus(); } break;
    case "ArrowUp":    if (focusIdx - cols >= 0) { focusIdx -= cols; paintFocus(); } break;
    case "PageDown":   $("gridwrap").scrollBy({ top: 400, behavior: "smooth" }); break;
    case "PageUp":     $("gridwrap").scrollBy({ top: -400, behavior: "smooth" }); break;
    case "Enter":      { const p = items[focusIdx]; if (p) openDetail(p); } break;
  }
});
$("q").oninput = e => { query = e.target.value; focusIdx = 0; renderGrid(); renderRail(); };

/* ---------- polling ---------- */
async function poll() {
  const t0 = performance.now();
  try {
    const s = await (await fetch("/api/state")).json();
    $("mLat").textContent = Math.round(performance.now() - t0) + "ms";
    state = s;
  } catch { state.connected = false; $("mLat").textContent = "—"; }
  render(); paintState();
}
poll(); setInterval(poll, 4000);
</script>
